<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compteur de points</title>
<meta name="description" content="Compteur de points pour les soirées jeux de société : classement animé, objectif, manches et annulation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../commun/base.css">
<style>
main { width: 100%; max-width: 560px; margin: 0 auto; padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 32px); }

.app-top { display: flex; align-items: flex-end; justify-content: space-between; gap: .8rem; flex-wrap: wrap; margin: .5rem 0 1.2rem; }
.app-title { font-family: var(--f-display); font-stretch: 125%; font-weight: 800; font-size: 2rem; line-height: 1; margin: 0; }
.app-sub { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); letter-spacing: .05em; margin-top: .4rem; }
.target { display: flex; align-items: center; gap: .4rem; font-size: .85rem; color: var(--muted); }
.target input { width: 5.6rem; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 .6rem; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.empty { padding: 2rem 1rem; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; }

.pl-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }
.pl { display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "av main score" "btns btns btns"; gap: .6rem .8rem; align-items: center; padding: .85rem; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.pl.lead { border-color: color-mix(in oklab, var(--signal) 70%, transparent); }
.pl-av { grid-area: av; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-weight: 700; font-family: var(--f-display); font-stretch: 125%; position: relative; }
.pl-rank { position: absolute; bottom: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 999px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); font-family: var(--f-mono); font-size: .66rem; display: grid; place-items: center; }
.pl.lead .pl-rank { background: var(--signal); color: #1d1400; border-color: var(--signal); }
.pl-main { grid-area: main; min-width: 0; display: grid; gap: .4rem; }
.pl-name { border: 0; background: transparent; font-weight: 600; font-size: 1.05rem; padding: .1rem .3rem; margin-left: -.3rem; border-radius: 6px; width: 100%; min-width: 0; }
.pl-name:hover { background: var(--surface-2); }
.pl-bar { height: 6px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.pl-bar i { display: block; height: 100%; width: 0; background: var(--c, var(--accent)); border-radius: 9px; transition: width .5s var(--ease); }
.pl-score { grid-area: score; font-family: var(--f-display); font-stretch: 125%; font-weight: 800; font-size: 2.2rem; font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; line-height: 1; }
.pl-score.pop { animation: pop .45s var(--ease); }
@keyframes pop { 40% { transform: scale(1.25); color: var(--accent); } }
.pl-btns { grid-area: btns; display: flex; gap: .4rem; }
.pl-btns button { flex: 1 1 0; min-width: 48px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-family: var(--f-mono); font-weight: 600; font-size: .9rem; font-variant-numeric: tabular-nums; transition: transform .15s, border-color .2s; touch-action: manipulation; }
.pl-btns button:hover { border-color: var(--accent); }
.pl-btns button:active { transform: scale(.94); }
.pl-btns .del { flex: 0 0 44px; min-width: 44px; color: var(--muted); }
.pl-btns .del:hover { color: var(--danger); border-color: var(--danger); }

.add-row { display: flex; gap: .5rem; margin-top: .9rem; }
.add-row input { flex: 1; min-width: 0; height: 48px; border-radius: 12px; border: 1px dashed var(--line); background: transparent; padding: 0 .9rem; }
.add-row input:focus { border-style: solid; border-color: var(--accent); outline: none; }
.add-row button { height: 48px; padding: 0 1.1rem; border-radius: 12px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600; }

.app-actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--line); }
.ghost { height: 42px; padding: 0 1rem; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-size: .88rem; display: inline-flex; align-items: center; gap: .4rem; }
.ghost:hover { border-color: var(--accent); }
.ghost.warn { border-color: var(--danger); color: var(--danger); }

.win { margin-bottom: .9rem; padding: .9rem 1rem; border-radius: 14px; background: var(--signal); color: #1d1400; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: .8rem; flex-wrap: wrap; }
.win button { border: 0; background: #1d1400; color: var(--signal); border-radius: 9px; height: 36px; padding: 0 .9rem; font-weight: 600; }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); z-index: 110; display: flex; align-items: center; gap: .9rem; max-width: calc(100% - 32px); padding: .75rem 1rem; border-radius: 14px; background: var(--ink); color: var(--bg); font-size: .92rem; box-shadow: 0 20px 40px -20px rgba(0, 0, 0, .5); animation: toastIn .3s var(--ease); }
.toast button { border: 0; background: transparent; color: var(--bg); font-weight: 700; text-decoration: underline; padding: 0; }
@keyframes toastIn { from { transform: translate(-50%, 12px); opacity: 0; } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 95; pointer-events: none; }
</style>
</head>
<body>
<header class="topbar">
  <a class="back-link" href="../">← Boîte à outils</a>
  <button class="theme-btn" id="themeBtn" type="button" aria-label="Changer de thème">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<main>
  <div class="app-top">
    <div>
      <h1 class="app-title">Compteur de points</h1>
      <div class="app-sub" id="round">Manche 1</div>
    </div>
    <label class="target" for="target">Objectif
      <input id="target" type="number" min="5" max="9999" step="5" inputmode="numeric">
    </label>
  </div>

  <div class="win" id="win" hidden><span id="winText"></span><button type="button" id="winReset">Nouvelle partie</button></div>
  <p class="empty" id="empty" hidden>Ajoutez les joueurs pour commencer la partie.</p>
  <ul class="pl-list" id="plList"></ul>

  <form class="add-row" id="addForm" autocomplete="off">
    <input id="addName" maxlength="18" placeholder="Nom du joueur" aria-label="Nom du nouveau joueur">
    <button type="submit">Ajouter</button>
  </form>

  <div class="app-actions">
    <button class="ghost" type="button" id="undoBtn">↶ Annuler</button>
    <button class="ghost" type="button" id="roundBtn">Manche suivante</button>
    <button class="ghost" type="button" id="resetBtn">Remettre à zéro</button>
  </div>
</main>

<script src="../commun/commun.js"></script>
<script>
(() => {
'use strict';

const $ = (s, r = document) => r.querySelector(s);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = Outils.createStore('compteur');
Outils.bindThemeButton($('#themeBtn'));

const MAX_PLAYERS = 12;
const COLORS = ['#3446ff', '#f0602f', '#0f9a6c', '#c03fd4', '#d99200', '#0891c9', '#d63447', '#5f9a12', '#7a4bd8', '#b8601a', '#1f8f8f', '#c2347a'];

/* ---------- Toast ---------- */
let toastEl = null, toastTimer = 0;
function toast(msg, action) {
  if (toastEl) toastEl.remove();
  clearTimeout(toastTimer);
  toastEl = document.createElement('div');
  toastEl.className = 'toast';
  toastEl.setAttribute('role', 'status');
  const s = document.createElement('span'); s.textContent = msg; toastEl.append(s);
  if (action) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = action.label;
    b.onclick = () => { action.run(); toastEl.remove(); };
    toastEl.append(b);
  }
  document.body.append(toastEl);
  toastTimer = setTimeout(() => toastEl && toastEl.remove(), 4200);
}

/* ---------- Confettis ---------- */
function confetti() {
  if (RM) return;
  let c = $('#confetti');
  if (!c) { c = document.createElement('canvas'); c.id = 'confetti'; document.body.append(c); }
  const ctx = c.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 2);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = [cs.getPropertyValue('--accent').trim(), cs.getPropertyValue('--signal').trim(), '#f0602f', '#0f9a6c', '#c03fd4'];
  const ps = Array.from({ length: 170 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .55,
    vx: (Math.random() - .5) * 15, vy: -Math.random() * 17 - 6, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .35,
    w: 6 + Math.random() * 6, h: 3 + Math.random() * 5, col: cols[Math.floor(Math.random() * cols.length)]
  }));
  const t0 = performance.now();
  (function tick(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) {
      p.vy += .42; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.col; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    if (t - t0 < 3200) requestAnimationFrame(tick); else c.remove();
  })(t0);
}

/* ---------- État de la partie ---------- */
const fresh = () => ({ target: 100, round: 1, winner: null, history: [], next: 1, players: [] });
let st = store.get('partie', null);
if (!st || !Array.isArray(st.players)) st = fresh();

const list = $('#plList'), els = new Map();
const save = () => store.set('partie', st);
const snap = () => {
  st.history.push(JSON.stringify({ players: st.players, round: st.round, winner: st.winner, target: st.target }));
  if (st.history.length > 40) st.history.shift();
};

function makeEl(p) {
  const li = document.createElement('li'); li.className = 'pl'; li.dataset.id = p.id;
  li.innerHTML = `<span class="pl-av"><span class="pl-ini"></span><span class="pl-rank"></span></span>
    <div class="pl-main"><input class="pl-name" maxlength="18" aria-label="Nom du joueur"><div class="pl-bar"><i></i></div></div>
    <output class="pl-score" aria-live="polite"></output>
    <div class="pl-btns">
      <button type="button" data-d="-1">−1</button><button type="button" data-d="1">+1</button>
      <button type="button" data-d="5">+5</button><button type="button" data-d="10">+10</button>
      <button type="button" class="del" aria-label="Retirer ce joueur">✕</button>
    </div>`;
  li.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.classList.contains('del')) return remove(p.id);
    change(p.id, +b.dataset.d);
  });
  const inp = $('.pl-name', li);
  inp.addEventListener('change', () => {
    const v = inp.value.trim(); const pl = st.players.find(x => x.id === p.id);
    if (!pl) return;
    if (!v) { inp.value = pl.name; return; }
    snap(); pl.name = v; render(); save();
  });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
  els.set(p.id, li);
  return li;
}

function render(pulseId) {
  const first = new Map();
  els.forEach((el, id) => first.set(id, el.getBoundingClientRect().top));
  const focused = document.activeElement;
  const sorted = [...st.players].sort((a, b) => b.score - a.score);
  const top = sorted.length ? sorted[0].score : 0;
  sorted.forEach((p, i) => {
    const el = els.get(p.id) || makeEl(p);
    const color = COLORS[p.c % COLORS.length];
    $('.pl-av', el).style.background = color;
    $('.pl-ini', el).textContent = (p.name[0] || '?').toUpperCase();
    $('.pl-rank', el).textContent = i + 1;
    const inp = $('.pl-name', el); if (document.activeElement !== inp) inp.value = p.name;
    $('.del', el).setAttribute('aria-label', 'Retirer ' + p.name);
    const sc = $('.pl-score', el); sc.textContent = p.score;
    const bar = $('.pl-bar i', el); bar.style.setProperty('--c', color);
    bar.style.width = Math.max(0, Math.min(100, p.score / st.target * 100)) + '%';
    el.classList.toggle('lead', i === 0 && p.score > 0 && sorted.filter(x => x.score === top).length === 1);
    if (pulseId === p.id && !RM) { sc.classList.remove('pop'); void sc.offsetWidth; sc.classList.add('pop'); }
    list.append(el);
  });
  els.forEach((el, id) => { if (!st.players.some(p => p.id === id)) { el.remove(); els.delete(id); } });
  if (focused && focused !== document.activeElement && document.contains(focused)) focused.focus({ preventScroll: true });
  if (!RM) els.forEach((el, id) => {
    const f = first.get(id);
    if (f == null) { el.animate([{ opacity: 0, transform: 'translateY(12px) scale(.98)' }, { opacity: 1, transform: 'none' }], { duration: 350, easing: 'cubic-bezier(.2,.8,.2,1)' }); return; }
    const dy = f - el.getBoundingClientRect().top;
    if (Math.abs(dy) > 1) el.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 480, easing: 'cubic-bezier(.2,.8,.2,1)' });
  });
  $('#empty').hidden = st.players.length > 0;
  $('#round').textContent = 'Manche ' + st.round;
  const t = $('#target'); if (document.activeElement !== t) t.value = st.target;
  const w = st.players.find(p => p.id === st.winner);
  $('#win').hidden = !w;
  if (w) $('#winText').textContent = `🏆 ${w.name} atteint ${st.target} points`;
}

function change(id, d) {
  const p = st.players.find(x => x.id === id); if (!p) return;
  snap(); p.score += d;
  if (!st.winner && p.score >= st.target) { st.winner = p.id; confetti(); }
  if (st.winner === p.id && p.score < st.target) st.winner = null;
  render(id); save();
}
function remove(id) {
  const p = st.players.find(x => x.id === id); if (!p) return;
  snap(); st.players = st.players.filter(x => x.id !== id);
  if (st.winner === id) st.winner = null;
  render(); save();
  toast(p.name + ' a été retiré', { label: 'Annuler', run: undo });
}
function add(name) {
  if (st.players.length >= MAX_PLAYERS) { toast(MAX_PLAYERS + ' joueurs maximum'); return false; }
  snap();
  const used = new Set(st.players.map(p => p.c % COLORS.length));
  let c = 0; while (used.has(c) && c < COLORS.length - 1) c++;
  st.players.push({ id: 'p' + (st.next++), name, score: 0, c });
  render(); save(); return true;
}
function undo() {
  const s = st.history.pop();
  if (!s) { toast('Rien à annuler'); return; }
  Object.assign(st, JSON.parse(s)); render(); save();
}
function reset() {
  snap();
  st.players.forEach(p => p.score = 0); st.round = 1; st.winner = null;
  render(); save(); toast('Scores remis à zéro', { label: 'Annuler', run: undo });
}

$('#addForm').addEventListener('submit', e => {
  e.preventDefault();
  const inp = $('#addName'), v = inp.value.trim();
  if (!v) { inp.focus(); return; }
  if (add(v)) inp.value = '';
});
$('#undoBtn').onclick = undo;
$('#roundBtn').onclick = () => { snap(); st.round++; render(); save(); };
$('#winReset').onclick = reset;
let armed = 0;
$('#resetBtn').onclick = e => {
  const b = e.currentTarget;
  if (!armed) { b.textContent = 'Confirmer ?'; b.classList.add('warn'); armed = setTimeout(() => { b.textContent = 'Remettre à zéro'; b.classList.remove('warn'); armed = 0; }, 3000); return; }
  clearTimeout(armed); armed = 0; b.textContent = 'Remettre à zéro'; b.classList.remove('warn'); reset();
};
$('#target').addEventListener('change', e => {
  const v = Math.max(5, Math.min(9999, Math.round(+e.target.value || 100)));
  snap(); st.target = v;
  const best = [...st.players].sort((a, b) => b.score - a.score)[0];
  st.winner = best && best.score >= v ? best.id : null;
  render(); save();
});
render();
})();
</script>
</body>
</html>
