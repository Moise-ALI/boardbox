<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title data-i18n="title">Compteur de points</title>
<meta name="description" content="Compteur de points pour les soirées jeux de société : une tuile colorée par joueur, objectif, manches et annulation.">
<link rel="canonical" href="https://boardbox.stream/compteur/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BoardBox">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="Compteur de points">
<meta property="og:description" content="Compteur de points pour les soirées jeux de société : une tuile colorée par joueur, objectif, manches et annulation.">
<meta property="og:url" content="https://boardbox.stream/compteur/">
<meta property="og:image" content="https://boardbox.stream/commun/icons/apercu-lien.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="BoardBox, outils et jeux pour vos soirées">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../commun/icons/favicon.png">
<link rel="apple-touch-icon" href="../commun/icons/apple-touch-icon.png">
<meta name="theme-color" content="#150c0a">
<link rel="stylesheet" href="../commun/base.css?v=13">
<script src="../commun/commun.js?v=9"></script>
<style>
main { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 32px); }

.app-top { display: flex; align-items: flex-end; justify-content: space-between; gap: .8rem; flex-wrap: wrap; margin: .5rem 0 1.2rem; }
.app-title { font-family: var(--f-display); font-weight: 800; font-size: 2rem; line-height: 1; margin: 0; }
.app-sub { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); letter-spacing: .05em; margin-top: .4rem; }
.target { display: flex; align-items: center; gap: .4rem; font-size: .85rem; color: var(--muted); }
.target input { width: 5.6rem; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 .6rem; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.empty { padding: 2rem 1rem; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; }

/* Une tuile colorée par joueur, en grille (2 colonnes sur téléphone) ; l'ordre reste fixe pour que les boutons ne bougent pas sous le doigt */
.pl-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.pl { --c: var(--player-1); display: flex; flex-direction: column; border-radius: 18px; overflow: hidden; background: var(--c); color: var(--on-color); box-shadow: var(--shadow); }
.pl.lead { outline: 3px solid var(--signal); outline-offset: 2px; }
.pl-head { display: flex; align-items: center; gap: .3rem; padding: 6px 6px 6px 8px; background: var(--tint-dark); }
.pl-name { flex: 1; min-width: 0; height: 36px; border: 0; border-radius: 8px; background: transparent; color: var(--on-color); font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; text-align: center; padding: 0 .3rem; }
.pl-name:hover, .pl-name:focus { background: var(--tint-dark); outline: none; }
.pl-delta { flex: none; min-width: 34px; height: 30px; padding: 0 6px; border-radius: 8px; background: var(--on-color); color: var(--c); font-family: var(--f-mono); font-weight: 700; font-size: .85rem; font-variant-numeric: tabular-nums; display: grid; place-items: center; }
.pl-delta.zero { opacity: .55; }
.pl-btns { display: flex; gap: 6px; padding: 10px 8px 0; }
.pl-btns.plus { padding: 0 8px 10px; }
.pl-btns button { flex: 1 1 0; min-width: 0; height: 44px; border-radius: 10px; border: 0; background: var(--tint-dark); color: var(--on-color); font-family: var(--f-mono); font-weight: 600; font-size: .95rem; font-variant-numeric: tabular-nums; transition: transform .12s, background-color .2s; touch-action: manipulation; }
.pl-btns button:active { transform: scale(.92); }
.pl-score { display: grid; place-items: center; min-height: 6.5rem; font-family: var(--f-display); font-weight: 800; font-size: 3.4rem; font-variant-numeric: tabular-nums; line-height: 1; }
.pl-score.long { font-size: 2.6rem; }
.pl-score.longer { font-size: 2rem; }
.pl-score.pop { animation: pop .4s var(--ease); }
@keyframes pop { 40% { transform: scale(1.2); } }
/* Bande du bas : se remplit vers l'objectif, avec le rang et le bouton pour retirer le joueur */
.pl-foot { position: relative; display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 0 0 10px; background: var(--tint-light); }
.pl-foot i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--tint-light); transition: width .5s var(--ease); }
.pl-rank { position: relative; font-family: var(--f-mono); font-size: .8rem; font-weight: 700; }
.pl.lead .pl-rank { background: var(--signal); color: var(--on-signal); border-radius: 999px; padding: 2px 8px; }
.pl-foot .del { position: relative; width: 44px; height: 44px; border: 0; background: transparent; color: var(--on-color); font-size: 1rem; opacity: .8; }
.pl-foot .del:hover { opacity: 1; }

.add-row { display: flex; gap: .5rem; margin-top: .9rem; }
.add-row input { flex: 1; min-width: 0; height: 48px; border-radius: 12px; border: 1px dashed var(--line); background: transparent; padding: 0 .9rem; }
.add-row input:focus { border-style: solid; border-color: var(--accent); outline: none; }
.add-row button { height: 48px; padding: 0 1.1rem; border-radius: 12px; border: 0; font-weight: 600; }

.app-actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--line); }
.ghost { height: 42px; padding: 0 1rem; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-size: .88rem; display: inline-flex; align-items: center; gap: .4rem; }
.ghost:hover { border-color: var(--accent); }
.ghost.warn { border-color: var(--danger); color: var(--danger); }

.win { margin-bottom: .9rem; padding: .9rem 1rem; border-radius: 14px; background: var(--signal); color: var(--on-signal); font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: .8rem; flex-wrap: wrap; }
.win button { border: 0; background: var(--on-signal); color: var(--signal); border-radius: 9px; height: 36px; padding: 0 .9rem; font-weight: 600; }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); z-index: 110; display: flex; align-items: center; gap: .9rem; max-width: calc(100% - 32px); padding: .75rem 1rem; border-radius: 14px; background: var(--ink); color: var(--bg); font-size: .92rem; box-shadow: var(--shadow); animation: toastIn .3s var(--ease); }
.toast button { border: 0; background: transparent; color: var(--bg); font-weight: 700; text-decoration: underline; padding: 0; }
@keyframes toastIn { from { transform: translate(-50%, 12px); opacity: 0; } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 95; pointer-events: none; }
</style>
</head>
<body>
<header class="topbar">
  <a class="back-link" href="../" data-i18n="common.back">← BoardBox</a>
  <div class="topbar-actions">
    <button class="lang-btn" id="langBtn" type="button" lang="en" aria-label="Switch to English">EN</button>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Changer de thème" data-i18n-aria-label="common.theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="app-top">
    <div>
      <h1 class="app-title grad-text" data-i18n="title">Compteur de points</h1>
      <div class="app-sub" id="round">Manche 1</div>
    </div>
    <label class="target" for="target"><span data-i18n="target">Objectif</span>
      <input id="target" type="number" min="5" max="9999" step="5" inputmode="numeric">
    </label>
  </div>

  <div class="win" id="win" hidden><span id="winText"></span><button type="button" id="winReset" data-i18n="newGame">Nouvelle partie</button></div>
  <p class="empty" id="empty" hidden data-i18n="empty">Ajoutez les joueurs pour commencer la partie.</p>
  <ul class="pl-list" id="plList"></ul>

  <form class="add-row" id="addForm" autocomplete="off">
    <input id="addName" maxlength="18" placeholder="Nom du joueur" aria-label="Nom du nouveau joueur" data-i18n-placeholder="playerName" data-i18n-aria-label="newPlayer">
    <button type="submit" class="btn-primary" data-i18n="add">Ajouter</button>
  </form>

  <div class="app-actions">
    <button class="ghost" type="button" id="undoBtn" data-i18n="undo">↶ Annuler</button>
    <button class="ghost" type="button" id="roundBtn" data-i18n="nextRound">Manche suivante</button>
    <button class="ghost" type="button" id="resetBtn" data-i18n="reset">Remettre à zéro</button>
  </div>
</main>

<script src="app.js?v=4"></script>
</body>
</html>
