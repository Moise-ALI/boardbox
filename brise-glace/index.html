<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title data-i18n="title">Brise-glace</title>
<meta name="description" content="Brise-glace : des cartes de questions pour lancer la conversation aux repas et aux soirées.">
<link rel="canonical" href="https://boardbox.stream/brise-glace/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BoardBox">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="Brise-glace">
<meta property="og:description" content="Brise-glace : des cartes de questions pour lancer la conversation aux repas et aux soirées.">
<meta property="og:url" content="https://boardbox.stream/brise-glace/">
<meta property="og:image" content="https://boardbox.stream/commun/icons/apercu-lien.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="BoardBox, outils et jeux pour vos soirées">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../commun/icons/favicon.png">
<link rel="apple-touch-icon" href="../commun/icons/apple-touch-icon.png">
<meta name="theme-color" content="#150c0a">
<link rel="stylesheet" href="../commun/base.css?v=13">
<script src="../commun/commun.js?v=9"></script>
<style>
main { width: 100%; max-width: 560px; margin: 0 auto; padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 24px); }
.app-title { font-family: var(--f-display); font-weight: 800; font-size: 2rem; line-height: 1.1; margin: .5rem 0 1rem; }
.screen { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; }   /* colonne bornée : la grille des paquets ne doit pas élargir la page */
.block { padding: 1rem; border-radius: 18px; }
.block h2 { margin: 0 0 .7rem; font-size: .8rem; font-family: var(--f-mono); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.hint { margin: 0 0 .7rem; font-size: .88rem; color: var(--muted); }

/* ---------- Choix des paquets ---------- */
.packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: .5rem; }
.pack { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: .1rem .6rem; min-height: 60px; padding: .5rem .8rem; border-radius: 14px; border: 1px solid var(--line); background: var(--field); text-align: left; }
.pack-icon { grid-row: span 2; font-size: 1.5rem; }
.pack-name { font-weight: 700; }
.pack-count { font-size: .8rem; color: var(--muted); }
.pack[aria-pressed="true"] { border-color: var(--c); background: var(--c); color: var(--on-color); }
.pack[aria-pressed="true"] .pack-count { color: inherit; opacity: .85; }

/* ---------- Mes cartes ---------- */
.add-row { display: flex; gap: .5rem; }
.field { flex: 1; min-width: 0; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--field); padding: 0 .8rem; color: inherit; font: inherit; }
.field:focus { outline: none; border-color: var(--accent); }
.add-btn { flex: none; height: 44px; padding: 0 1rem; border-radius: 10px; font-weight: 600; }
.rows { list-style: none; margin: .7rem 0 0; padding: 0; display: grid; gap: .4rem; }
.rows:empty { display: none; }
.row { display: flex; align-items: center; gap: .5rem; min-height: 44px; padding: .3rem .3rem .3rem .8rem; border-radius: 10px; border: 1px solid var(--line); background: var(--field); }
.row-text { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: .92rem; }
.row button { flex: none; width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); }
.row button:hover { color: var(--accent); }
.mine { display: grid; grid-template-columns: minmax(0, 1fr); gap: .7rem; }
.mine h2, .mine .hint { margin-bottom: 0; }
.fold { border: 1px solid var(--line); border-radius: 12px; padding: 0 .8rem; background: var(--field); }
.fold summary { min-height: 44px; display: flex; align-items: center; font-weight: 600; cursor: pointer; }
.fold[open] { padding-bottom: .8rem; }
.fold .hint { margin: 0 0 .5rem; }
.area { display: block; width: 100%; height: auto; padding: .6rem .8rem; resize: vertical; line-height: 1.4; }
.tools-row { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .6rem; }
.import-result { margin: .6rem 0 0; font-size: .9rem; font-weight: 600; color: var(--accent); }
.error { margin: 0; padding: .8rem 1rem; border-radius: 12px; border: 1px solid var(--accent-3); color: var(--accent-3); font-weight: 600; }
.big-btn { height: 56px; border-radius: 14px; border: 0; font-weight: 700; font-size: 1.05rem; }
.ghost { height: 44px; padding: 0 1rem; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-size: .9rem; }
.ghost:hover { border-color: var(--accent); }

/* ---------- Jeu ---------- */
.play-info { display: flex; justify-content: space-between; gap: .5rem; font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
/* Carte en verre dépoli : des halos flous à la couleur du paquet (--c) passent derrière,
   le verre les laisse deviner. Une seule carte à l'écran : pas d'enjeu de fluidité. */
.question-stage { --c: var(--player-1); position: relative; isolation: isolate; }
.question-stage::before { content: ''; position: absolute; inset: 6% 4%; z-index: -1; pointer-events: none;
  background: radial-gradient(circle at 22% 28%, var(--c) 0 20%, transparent 46%), radial-gradient(circle at 80% 74%, var(--c) 0 16%, transparent 42%);
  filter: blur(26px); opacity: .8; }
.question-card { touch-action: pan-y; display: grid; place-items: center; align-content: center; gap: 1rem; width: 100%; min-height: min(56vh, 460px); padding: 2rem 1.4rem; border-radius: 28px; text-align: center; color: var(--ink);
  background: linear-gradient(145deg, color-mix(in srgb, var(--c) 22%, var(--surface)), var(--surface));
  border: 1px solid color-mix(in srgb, var(--c) 40%, var(--line));
  box-shadow: var(--shadow-lg), inset 0 1px 0 color-mix(in srgb, var(--surface-2) 80%, transparent);
  backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); }
.question-text { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.35rem, 6vw, 1.9rem); line-height: 1.3; margin: 0; overflow-wrap: anywhere; }
.question-pack { padding: .3rem .8rem; border-radius: 999px; font-size: .82rem; font-weight: 600; background: color-mix(in srgb, var(--c) 25%, transparent); }
.question-card.appear { animation: cardIn .35s var(--ease) both; }
@keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.97); } }
.question-stage.empty::before { opacity: 0; }
.question-card.empty { border-style: dashed; }
.controls { display: grid; grid-template-columns: 1fr 1.4fr; gap: .5rem; }
.controls button { height: 52px; border-radius: 14px; font-weight: 700; }
.controls .ghost { height: 52px; }
</style>
</head>
<body>
<header class="topbar">
  <a class="back-link" href="../" data-i18n="common.back">← BoardBox</a>
  <div class="topbar-actions">
    <button class="lang-btn" id="langBtn" type="button" lang="en" aria-label="Switch to English">EN</button>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Changer de thème" data-i18n-aria-label="common.theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main>
  <h1 class="app-title grad-text" data-i18n="title">Brise-glace</h1>

  <!-- Choix des paquets et cartes personnelles -->
  <section class="screen" id="setupScreen">
    <div class="block card">
      <h2 data-i18n="packsTitle">Paquets</h2>
      <p class="hint" data-i18n="packsHint">Choisissez un ou plusieurs paquets : leurs cartes sont mélangées.</p>
      <div class="packs" id="packList"></div>
    </div>

    <div class="block card mine">
      <h2 data-i18n="mineTitle">Mes cartes</h2>
      <p class="hint" id="mineSummary"></p>
      <button class="big-btn btn-primary" type="button" id="playMineBtn" hidden data-i18n="playMine">Jouer avec mes cartes seulement</button>

      <details class="fold" id="importBox">
        <summary data-i18n="importTitle">Importer une liste</summary>
        <p class="hint" data-i18n="importHint">Collez vos questions (depuis Notes, un message…), une par ligne, ou choisissez un fichier texte.</p>
        <textarea class="field area" id="importText" rows="6" placeholder="Une question par ligne" data-i18n-placeholder="importPlaceholder" aria-label="Questions à importer" data-i18n-aria-label="importTitle"></textarea>
        <div class="tools-row">
          <button class="btn-primary add-btn" type="button" id="importBtn" data-i18n="importAdd">Ajouter ces cartes</button>
          <button class="ghost" type="button" id="importFileBtn" data-i18n="importFile">Depuis un fichier .txt</button>
          <input type="file" id="importFile" accept=".txt,text/plain" hidden>
        </div>
        <p class="import-result" id="importResult" role="status" hidden></p>
      </details>

      <form class="add-row" id="mineForm">
        <input class="field" id="mineInput" maxlength="300" autocomplete="off" enterkeyhint="done"
               placeholder="Ajouter une question…" data-i18n-placeholder="minePlaceholder" aria-label="Ajouter une question" data-i18n-aria-label="minePlaceholder">
        <button class="btn-primary add-btn" type="submit" data-i18n="add">Ajouter</button>
      </form>

      <details class="fold" id="mineDetails" hidden>
        <summary id="mineListTitle"></summary>
        <ul class="rows" id="mineList"></ul>
        <div class="tools-row">
          <button class="ghost" type="button" id="exportBtn" data-i18n="export">Exporter (.txt)</button>
          <button class="ghost" type="button" id="clearBtn" data-i18n="clearAll">Tout effacer</button>
        </div>
      </details>
    </div>

    <p class="error" id="setupError" role="alert" hidden></p>
    <button class="big-btn btn-primary" type="button" id="startBtn" data-i18n="start">Tirer une carte</button>
  </section>

  <!-- Une carte à la fois -->
  <section class="screen" id="playScreen" hidden>
    <div class="play-info"><span id="remainingInfo" aria-live="polite"></span><span id="positionInfo"></span></div>
    <div class="question-stage" id="questionStage">
      <button class="question-card" type="button" id="questionCard" aria-describedby="tapHint">
        <p class="question-text" id="questionText"></p>
        <span class="question-pack" id="questionPack"></span>
      </button>
    </div>
    <span id="tapHint" hidden data-i18n="tapHint">Touchez la carte ou balayez-la pour passer à la suivante</span>
    <div class="controls">
      <button class="ghost" type="button" id="prevBtn" data-i18n="previous">← Précédente</button>
      <button class="btn-primary" type="button" id="nextBtn" data-i18n="next">Carte suivante →</button>
    </div>
    <div class="controls">
      <button class="ghost" type="button" id="packsBtn" data-i18n="changePacks">Paquets</button>
      <button class="ghost" type="button" id="resetBtn" data-i18n="reset">Remettre les cartes</button>
    </div>
  </section>
</main>

<script src="app.js?v=4"></script>
</body>
</html>
