<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boîte à outils</title>
<meta name="description" content="Les petits outils de Moïse, accessibles partout.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="commun/base.css?v=3">
<script src="commun/commun.js?v=3"></script>
<style>
main { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 40px); }
.hero { margin: 1.5rem 0 2rem; }
.eyebrow { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 850; font-size: clamp(2.4rem, 9vw, 4rem); line-height: .95; letter-spacing: -.02em; margin: .6rem 0 .8rem; }

.lead { color: var(--muted); max-width: 52ch; margin: 0; }

.tools { list-style: none; margin: 0; padding: 0; display: grid; gap: .8rem; }
@media (min-width: 600px) { .tools { grid-template-columns: 1fr 1fr; } }
.tool { display: grid; grid-template-columns: auto 1fr; gap: .3rem 1rem; align-items: start; height: 100%; padding: 1.2rem; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); color: inherit; text-decoration: none; transition: border-color .2s, transform .3s var(--ease); }
.tool:hover { border-color: var(--accent); transform: translateY(-2px); }
.tool-icon { grid-row: span 2; width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font-size: 1.5rem; background: var(--surface-2); }
.tool h2 { font-family: var(--f-display); font-size: 1.25rem; line-height: 1.15; margin: .15rem 0 0; }
.tool p { color: var(--muted); font-size: .92rem; margin: 0; }

.foot { margin-top: 2.5rem; padding-top: 1.2rem; border-top: 1px solid var(--line); font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.foot a { color: inherit; }
</style>
</head>
<body>
<header class="topbar">
  <span class="eyebrow">moise-ali.github.io</span>
  <button class="theme-btn" id="themeBtn" type="button" aria-label="Changer de thème">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<main>
  <section class="hero">
    <span class="eyebrow" id="count">Outils</span>
    <h1><span class="grad-text">Boîte à outils</span></h1>
    <p class="lead">Mes petites applis du quotidien, utilisables depuis n'importe quel appareil. Les données restent dans votre navigateur.</p>
  </section>

  <ul class="tools" id="tools"></ul>

  <p class="foot">Fait par Moïse · <a href="https://github.com/Moise-ALI/outils">code source</a></p>
</main>

<script>
(() => {
'use strict';

/* Registre des outils : pour en ajouter un, créez son dossier et ajoutez une ligne ici. */
const TOOLS = [
  { path: 'tirage/', icon: '🎲', name: 'Tirage & Équipes', desc: 'Tirez au sort dans une liste ou répartissez-la en équipes équilibrées.' },
  { path: 'compteur/', icon: '🏆', name: 'Compteur de points', desc: 'Comptez les scores des soirées jeux : classement animé, objectif et manches.' },
  { path: 'undercover/', icon: '🕵️', name: 'Undercover', desc: 'Le jeu d\'ambiance sur un seul téléphone : civils, undercovers et Mister White.' }
];

Outils.bindThemeButton(document.getElementById('themeBtn'));
document.getElementById('count').textContent = TOOLS.length + ' outil' + (TOOLS.length > 1 ? 's' : '');

const list = document.getElementById('tools');
for (const t of TOOLS) {
  const li = document.createElement('li');
  const a = document.createElement('a');
  a.className = 'tool glass';
  a.href = t.path;
  const icon = document.createElement('span'); icon.className = 'tool-icon'; icon.setAttribute('aria-hidden', 'true'); icon.textContent = t.icon;
  const h = document.createElement('h2'); h.textContent = t.name;
  const p = document.createElement('p'); p.textContent = t.desc;
  a.append(icon, h, p);
  li.append(a);
  list.append(li);
}
})();
</script>
</body>
</html>
