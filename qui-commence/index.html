<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title data-i18n="title">Qui commence ?</title>
<meta name="description" content="Chacun pose un doigt sur l'écran, l'appli désigne qui commence ou l'ordre de jeu.">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../commun/icons/favicon.png">
<link rel="apple-touch-icon" href="../commun/icons/apple-touch-icon.png">
<meta name="theme-color" content="#150c0a">
<link rel="stylesheet" href="../commun/base.css?v=13">
<script src="../commun/commun.js?v=8"></script>
<style>
/* La page tient dans l'écran : la zone tactile prend toute la hauteur restante */
body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; overscroll-behavior: none; }
main { flex: 1; min-height: 0; width: 100%; max-width: 760px; margin: 0 auto; padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; flex-direction: column; gap: .8rem; }

.app-top { display: flex; align-items: center; justify-content: space-between; gap: .6rem; flex-wrap: wrap; }
.app-title { font-family: var(--f-display); font-weight: 800; font-size: 1.7rem; line-height: 1.1; margin: 0; }
.modes { display: flex; padding: 3px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.modes button { height: 40px; padding: 0 .9rem; border: 0; border-radius: 9px; background: transparent; font-weight: 600; font-size: .88rem; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--btn-primary-bg); color: var(--btn-primary-ink); }

/* Zone tactile : aucun geste du navigateur (défilement, zoom, loupe, menu d'appui long) */
.zone { position: relative; flex: 1; min-height: 0; overflow: hidden; border-radius: 22px; border: 2px dashed var(--line); background: var(--surface);
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.zone.active { border-style: solid; }
.hint { position: absolute; inset: 0; display: grid; place-items: center; padding: 1.5rem; text-align: center; color: var(--muted); font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; pointer-events: none; }
.zone.active .hint { place-items: start center; padding-top: 1rem; font-size: 1.05rem; }
.reset { position: absolute; right: 10px; bottom: 10px; height: 44px; padding: 0 1rem; border-radius: 12px; border: 1px solid var(--line); background: var(--field); font-size: .88rem; z-index: 2; }

/* Un cercle par doigt, centré sur le point de contact (left/top), à la couleur du joueur (--c) */
.marker { --c: var(--player-1); position: absolute; left: 0; top: 0; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%;
  background: var(--c); box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 35%, transparent), var(--shadow);
  display: grid; place-items: center; color: var(--on-color); font-family: var(--f-display); font-weight: 800; font-size: 2.6rem; line-height: 1;
  pointer-events: none; transition: transform .35s var(--ease), opacity .35s var(--ease); animation: appear .25s var(--ease); }
@keyframes appear { from { transform: scale(.4); opacity: 0; } }
/* Anneau qui se resserre pendant l'attente : le tirage a lieu quand il touche le cercle */
.marker.arming::after { content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 4px solid var(--c); animation: arm 2s linear forwards; }
@keyframes arm { from { transform: scale(1.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.marker.chosen { transform: scale(1.45); box-shadow: 0 0 0 10px color-mix(in srgb, var(--c) 40%, transparent), 0 0 60px var(--c); }
.marker.out { transform: scale(.7); opacity: .18; }
@media (prefers-reduced-motion: reduce) { .marker, .marker.arming::after { animation: none; transition: none; } }
</style>
</head>
<body>
<header class="topbar">
  <a class="back-link" href="../" data-i18n="common.back">← BoardBox</a>
  <div class="topbar-actions">
    <button class="lang-btn" id="langBtn" type="button">EN</button>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Changer de thème" data-i18n-aria-label="common.theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="app-top">
    <h1 class="app-title grad-text" data-i18n="title">Qui commence ?</h1>
    <div class="modes" role="group" aria-label="Mode" data-i18n-aria-label="modeLabel">
      <button type="button" id="modeOne" data-i18n="modeOne">Un gagnant</button>
      <button type="button" id="modeOrder" data-i18n="modeOrder">Ordre</button>
    </div>
  </div>

  <div class="zone" id="zone">
    <p class="hint" id="hint" aria-live="polite"></p>
    <button type="button" class="reset" id="resetBtn" hidden data-i18n="reset">Recommencer</button>
  </div>
</main>

<script src="app.js?v=1"></script>
</body>
</html>
