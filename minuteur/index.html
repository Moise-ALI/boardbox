<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title data-i18n="title">Minuteur de tours</title>
<meta name="description" content="Minuteur de tours pour les jeux de société : sablier par tour ou pendule par joueur.">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../commun/icons/favicon.png">
<link rel="apple-touch-icon" href="../commun/icons/apple-touch-icon.png">
<meta name="theme-color" content="#150c0a">
<link rel="stylesheet" href="../commun/base.css?v=13">
<script src="../commun/commun.js?v=8"></script>
<style>
main { width: 100%; max-width: 560px; margin: 0 auto; padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 24px); }
.app-title { font-family: var(--f-display); font-weight: 800; font-size: 2rem; line-height: 1.1; margin: .5rem 0 1rem; }

/* ---------- Réglages ---------- */
.setup { display: grid; gap: 1rem; }
.block { padding: 1rem; border-radius: 18px; }
.block h2 { margin: 0 0 .7rem; font-size: .8rem; font-family: var(--f-mono); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.modes { display: flex; padding: 3px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); }
.modes button { flex: 1; height: 44px; border: 0; border-radius: 9px; background: transparent; font-weight: 600; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--btn-primary-bg); color: var(--btn-primary-ink); }
.mode-desc { margin: .6rem 0 0; font-size: .88rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chips button { min-width: 64px; height: 44px; padding: 0 .8rem; border-radius: 10px; border: 1px solid var(--line); background: var(--field); font-family: var(--f-mono); font-weight: 600; font-size: .9rem; }
.chips button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }

.pl-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; }
.pl-row { display: flex; align-items: center; gap: .5rem; }
.pl-dot { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--c); margin: 0 .2rem; }
.pl-row input { flex: 1; min-width: 0; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--field); padding: 0 .8rem; }
.pl-row button { flex: none; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--muted); }
.pl-row button:disabled { opacity: .35; }
.pl-tools { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .7rem; }
.ghost { height: 44px; padding: 0 1rem; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-size: .88rem; }
.ghost:hover { border-color: var(--accent); }
.start-row { display: grid; gap: .5rem; }
.big-btn { height: 56px; border-radius: 14px; border: 0; font-weight: 700; font-size: 1.05rem; }

/* ---------- Partie (plein écran) ---------- */
/* Pendant la partie, la page tient dans l'écran. min-height: 0 annule le 100vh de base.css
   (sur iPhone, 100vh ignore les barres du navigateur et ferait dépasser la zone en bas). */
body.playing { display: flex; flex-direction: column; height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; overscroll-behavior: none; }
body.playing main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: .6rem; max-width: 760px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
body.playing .app-title { display: none; }
.game { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: .6rem; }
.game-info { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }

.turn { --c: var(--player-1); position: relative; flex: 1; min-height: 0; width: 100%; overflow: hidden; border: 0; border-radius: 24px; background: var(--c); color: var(--on-color);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3rem; padding: 1rem;
  touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; box-shadow: var(--shadow); }
.turn-name { font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.turn-time { font-family: var(--f-display); font-weight: 800; font-size: clamp(4rem, 24vw, 8rem); line-height: 1; font-variant-numeric: tabular-nums; }
.turn-hint { font-size: .9rem; opacity: .85; }
.turn-bar { position: absolute; left: 0; bottom: 0; height: 10px; width: 100%; background: var(--tint-dark); }
.turn-bar i { display: block; height: 100%; width: 100%; background: var(--tint-light); transform-origin: left; }
.turn.paused .turn-time { opacity: .5; }
.turn.low .turn-time { animation: beat 1s steps(2, jump-none) infinite; }
@keyframes beat { 50% { opacity: .55; } }
/* Temps écoulé : un voile sombre clignote sur la couleur du joueur */
.turn.over::before { content: ''; position: absolute; inset: 0; background: var(--tint-dark); animation: flash .8s ease-in-out infinite alternate; }
.turn > * { position: relative; }
.turn > .turn-bar { position: absolute; }
@keyframes flash { from { opacity: 0; } to { opacity: 1; } }

.queue { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .4rem; }
.queue li { display: flex; align-items: center; gap: .4rem; height: 34px; padding: 0 .7rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: .85rem; max-width: 100%; }
.queue .q-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.queue .q-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.queue .q-time { font-family: var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.queue .q-time.neg { color: var(--danger); }
.controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .5rem; }
.controls button { height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: .9rem; }
.controls button:disabled { opacity: .4; }
@media (prefers-reduced-motion: reduce) { .turn.low .turn-time, .turn.over::before { animation: none; } .turn.over::before { opacity: .6; } }
</style>
</head>
<body>
<header class="topbar">
  <a class="back-link" href="../" data-i18n="common.back">← BoardBox</a>
  <div class="topbar-actions">
    <button class="lang-btn" id="langBtn" type="button">EN</button>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Changer de thème" data-i18n-aria-label="common.theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main>
  <h1 class="app-title grad-text" data-i18n="title">Minuteur de tours</h1>

  <section class="setup" id="setup">
    <div class="block card">
      <h2 data-i18n="modeTitle">Mode</h2>
      <div class="modes" role="group" aria-label="Mode" data-i18n-aria-label="modeTitle">
        <button type="button" id="modeHourglass" data-i18n="modeHourglass">Sablier</button>
        <button type="button" id="modeClock" data-i18n="modeClock">Pendule</button>
      </div>
      <p class="mode-desc" id="modeDesc"></p>
    </div>

    <div class="block card">
      <h2 id="durationTitle"></h2>
      <div class="chips" id="durations"></div>
    </div>

    <div class="block card">
      <h2 data-i18n="playersTitle">Joueurs, dans l'ordre du jeu</h2>
      <ul class="pl-list" id="plList"></ul>
      <div class="pl-tools">
        <button type="button" class="ghost" id="addBtn" data-i18n="addPlayer">+ Ajouter un joueur</button>
        <button type="button" class="ghost" id="importBtn" hidden data-i18n="importPlayers">Reprendre les joueurs du compteur</button>
      </div>
    </div>

    <div class="start-row">
      <button type="button" class="big-btn btn-primary" id="startBtn" data-i18n="start">Lancer la partie</button>
      <button type="button" class="big-btn ghost" id="resumeBtn" hidden data-i18n="resume">Reprendre la partie en cours</button>
    </div>
  </section>

  <section class="game" id="game" hidden>
    <div class="game-info"><span id="roundInfo"></span><span id="modeInfo"></span></div>
    <button type="button" class="turn" id="turnBtn">
      <span class="turn-name" id="turnName"></span>
      <span class="turn-time" id="turnTime" aria-live="off"></span>
      <span class="turn-hint" id="turnHint"></span>
      <span class="turn-bar" id="turnBar"><i></i></span>
    </button>
    <ul class="queue" id="queue" aria-label="Joueurs suivants" data-i18n-aria-label="queueLabel"></ul>
    <div class="controls">
      <button type="button" id="prevBtn" data-i18n="previous">← Précédent</button>
      <button type="button" id="pauseBtn"></button>
      <button type="button" id="settingsBtn" data-i18n="settings">Réglages</button>
    </div>
  </section>
</main>

<script src="app.js?v=2"></script>
</body>
</html>
