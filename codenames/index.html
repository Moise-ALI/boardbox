<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://qwpmfexatemoxnruqtab.supabase.co wss://qwpmfexatemoxnruqtab.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<!-- no-referrer : le lien espion (avec #) ne doit fuiter nulle part -->
<meta name="referrer" content="no-referrer">
<title data-i18n="title">Nom de code</title>
<meta name="description" content="Nom de code : jeu d'espions en équipes, avec vue espion et vue joueur synchronisées en temps réel.">
<link rel="stylesheet" href="../commun/base.css?v=8">
<script src="../commun/commun.js?v=5"></script>
<style>
main { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 40px); }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(2rem, 8vw, 2.6rem); line-height: 1; margin: .4rem 0 .5rem; }
h2 { font-family: var(--f-display); font-size: 1.1rem; margin: 0 0 .8rem; }
.sub { color: var(--muted); margin: 0 0 1.3rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 1.1rem; margin-bottom: .9rem; }
.row { display: flex; gap: .5rem; flex-wrap: wrap; }
.row > input { flex: 1 1 160px; min-width: 0; }
input[type=text] { height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); padding: 0 .9rem; font-family: var(--f-mono); letter-spacing: .08em; }
input:focus { outline: none; border-color: var(--accent); }
.btn { height: 48px; padding: 0 1.1rem; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: .4rem; touch-action: manipulation; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--btn-primary-bg); color: var(--btn-primary-ink); border-color: transparent; box-shadow: var(--btn-primary-shadow); }
.btn.big { width: 100%; height: 56px; font-size: 1.05rem; border-radius: 16px; }
.btn.small { height: 40px; padding: 0 .8rem; font-size: .88rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: .9rem; }
.seg button { height: 44px; min-width: 64px; border: 0; background: var(--field); font-weight: 600; font-family: var(--f-mono); }
.seg button[aria-pressed="true"] { background: var(--btn-primary-bg); color: var(--btn-primary-ink); }
.label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: .4rem; }
.error { color: var(--danger); font-size: .9rem; margin: .6rem 0 0; min-height: 1.2em; }
.rules { margin: 0; padding-left: 1.2rem; color: var(--muted); display: grid; gap: .4rem; }

/* ---------- Partie ---------- */
.bar { display: flex; align-items: center; justify-content: space-between; gap: .5rem; flex-wrap: wrap; margin: .2rem 0 .7rem; }
.chips { display: flex; gap: .35rem; flex-wrap: wrap; align-items: center; }
.chip { font-family: var(--f-mono); font-size: .72rem; padding: .25rem .55rem; border-radius: 8px; background: var(--surface-2); color: var(--muted); }
.chip.spy { background: var(--card-assassin); color: var(--on-color); }
.live { display: inline-flex; align-items: center; gap: .35rem; font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
.live.on i { background: var(--ok); }
.scores { display: grid; grid-template-columns: 1fr auto 1fr; gap: .5rem; align-items: center; margin-bottom: .7rem; }
.score { display: flex; align-items: baseline; gap: .4rem; padding: .55rem .8rem; border-radius: 14px; color: var(--on-color); font-weight: 700; }
.score.red { background: var(--team-red); }
.score.blue { background: var(--team-blue); justify-content: flex-end; }
.score b { font-family: var(--f-display); font-size: 1.6rem; line-height: 1; }
.score small { font-weight: 500; opacity: .9; font-size: .78rem; }
.turn { font-family: var(--f-display); font-weight: 700; font-size: .9rem; text-align: center; padding: .4rem .6rem; border-radius: 999px; border: 2px solid currentColor; white-space: nowrap; }
.turn.red { color: var(--team-red); }
.turn.blue { color: var(--team-blue); }
.banner { text-align: center; padding: .9rem; border-radius: 16px; color: var(--on-color); margin-bottom: .7rem; }
.banner.red { background: var(--team-red); }
.banner.blue { background: var(--team-blue); }
.banner b { display: block; font-family: var(--f-display); font-size: 1.4rem; }
.hint { color: var(--muted); font-size: .85rem; text-align: center; margin: 0 0 .6rem; }

.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: .9rem; }
.word { position: relative; aspect-ratio: 4 / 3; min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2);
        display: grid; place-items: center; padding: 3px; text-align: center; font-family: var(--f-display); font-weight: 700;
        font-size: clamp(.58rem, 2.6vw, .95rem); line-height: 1.1; overflow-wrap: anywhere; hyphens: auto; touch-action: manipulation;
        transition: background .3s, color .3s, transform .15s, border-color .2s; color: var(--ink); }
.word:not(:disabled):hover { border-color: var(--accent); }
.word:not(:disabled):active { transform: scale(.96); }
.word:disabled { cursor: default; }
.word.selected { border: 2px solid var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.word.pending { opacity: .6; }
/* Cartes retournées : couleur pleine */
.word.is-red { background: var(--team-red); color: var(--on-color); border-color: transparent; }
.word.is-blue { background: var(--team-blue); color: var(--on-color); border-color: transparent; }
.word.is-neutral { background: var(--card-neutral); color: var(--ink); border-color: transparent; }
.word.is-assassin { background: var(--card-assassin); color: var(--on-color); border-color: transparent; }
.word.revealed span { opacity: .55; text-decoration: line-through; }
/* Vue espion : cartes non retournées teintées, bordure à la couleur */
.word.key-red { background: color-mix(in srgb, var(--team-red) 22%, var(--surface-2)); border: 2px solid var(--team-red); }
.word.key-blue { background: color-mix(in srgb, var(--team-blue) 22%, var(--surface-2)); border: 2px solid var(--team-blue); }
.word.key-neutral { background: color-mix(in srgb, var(--card-neutral) 45%, var(--surface-2)); border: 2px dashed var(--card-neutral); }
.word.key-assassin { background: var(--card-assassin); color: var(--on-color); border: 2px solid var(--card-assassin); }
.actions { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; }
.leave { display: block; margin: 1rem auto 0; background: none; border: 0; color: var(--muted); text-decoration: underline; padding: .4rem; }

/* ---------- Fenêtres ---------- */
dialog { width: min(480px, calc(100% - 24px)); border: 1px solid var(--line); border-radius: 20px; background: var(--surface-2); color: var(--ink); padding: 1.2rem; }
dialog::backdrop { background: var(--overlay); backdrop-filter: blur(3px); }
dialog h2 { margin-bottom: .6rem; }
.share-item { padding: .8rem 0; border-top: 1px solid var(--line); }
.share-item b { display: block; }
.share-item p { color: var(--muted); font-size: .85rem; margin: .2rem 0 .5rem; }
.share-item.spy b { color: var(--danger); }
.share-item input { width: 100%; height: 40px; font-size: .78rem; letter-spacing: 0; margin-bottom: .5rem; }
dialog .actions { justify-content: flex-end; margin-top: .6rem; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); z-index: 110; max-width: calc(100% - 32px); padding: .75rem 1rem; border-radius: 14px; background: var(--ink); color: var(--bg); font-size: .92rem; box-shadow: var(--shadow); }
</style>
</head>
<body>
<header class="topbar">
  <a class="back-link" href="../" data-i18n="common.back">← Boîte à outils</a>
  <div class="topbar-actions">
    <button class="lang-btn" id="langBtn" type="button">EN</button>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Changer de thème" data-i18n-aria-label="common.theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main id="app" aria-live="polite"></main>

<dialog id="shareDlg">
  <h2 data-i18n="share.title">Inviter les joueurs</h2>
  <div class="share-item">
    <b data-i18n="share.player">Lien joueur</b>
    <p data-i18n="share.playerHint">Pour tout le monde : on voit les mots, pas les couleurs.</p>
    <input type="text" id="playerLink" readonly aria-label="Lien joueur" data-i18n-aria-label="share.player">
    <div class="row"><button class="btn small" type="button" id="copyPlayer" data-i18n="share.copy">Copier</button><button class="btn small" type="button" id="sendPlayer" data-i18n="share.send" hidden>Envoyer</button></div>
  </div>
  <div class="share-item spy" id="spyShare" hidden>
    <b data-i18n="share.spy">Lien espion</b>
    <p data-i18n="share.spyHint">Uniquement pour les deux maîtres-espions : il révèle toutes les couleurs.</p>
    <input type="text" id="spyLink" readonly aria-label="Lien espion" data-i18n-aria-label="share.spy">
    <div class="row"><button class="btn small" type="button" id="copySpy" data-i18n="share.copy">Copier</button><button class="btn small" type="button" id="sendSpy" data-i18n="share.send" hidden>Envoyer</button></div>
  </div>
  <div class="actions"><button class="btn" type="button" id="shareClose" data-i18n="share.close">Fermer</button></div>
</dialog>

<dialog id="confirmDlg">
  <p id="confirmText"></p>
  <div class="actions">
    <button class="btn" type="button" id="confirmNo" data-i18n="cancel">Annuler</button>
    <button class="btn primary" type="button" id="confirmYes" data-i18n="confirm">Confirmer</button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>
<script src="../commun/supabase-config.js?v=1"></script>
<script src="mots.js?v=1"></script>
<script src="i18n.js?v=1"></script>
<script src="donnees.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
