<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://qwpmfexatemoxnruqtab.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Undercover</title>
<meta name="description" content="Le jeu Undercover sur un seul téléphone : civils, undercovers et Mister White.">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../commun/icons/favicon.png">
<link rel="apple-touch-icon" href="../commun/icons/apple-touch-icon.png">
<meta name="theme-color" content="#150c0a">
<link rel="stylesheet" href="../commun/base.css?v=11">
<script src="../commun/commun.js?v=8"></script>
<style>
main { width: 100%; max-width: 560px; margin: 0 auto; padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 40px); }
h1 { font-family: var(--f-display); font-weight: 850; font-size: 2.2rem; line-height: 1; margin: .4rem 0 .4rem; letter-spacing: -.01em; }
h2 { font-family: var(--f-display); font-size: 1.15rem; margin: 0 0 .7rem; }
.sub { color: var(--muted); margin: 0 0 1.4rem; }
.eyebrow { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 1.1rem; margin-bottom: .9rem; }

/* Joueurs */
.chips { display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: .8rem; min-height: 1rem; }
.chip { display: inline-flex; align-items: center; gap: .3rem; height: 38px; padding: 0 .35rem 0 .8rem; border-radius: 999px; background: var(--surface-2); font-weight: 600; font-size: .92rem; }
.chip .n { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); }
.chip button { width: 30px; height: 30px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); font-size: 1rem; }
.chip button:hover { color: var(--danger); }
.hint { color: var(--muted); font-size: .85rem; margin: .5rem 0 0; }
.row { display: flex; gap: .5rem; }
.row input { flex: 1; min-width: 0; }
input[type=text] { height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); padding: 0 .9rem; }
input[type=text]:focus, select:focus { outline: none; border-color: var(--accent); }
select { height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); padding: 0 .7rem; width: 100%; }

/* Thèmes */
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; }
.quick { display: flex; gap: .8rem; }
.themes { display: flex; flex-wrap: wrap; gap: .45rem; }
.theme { display: inline-flex; align-items: center; gap: .4rem; min-height: 40px; padding: .35rem .75rem; border-radius: 999px; border: 1px solid var(--line); background: var(--field); color: var(--muted); font-size: .88rem; font-weight: 600; transition: background .2s, color .2s, border-color .2s; }
.theme small { font-family: var(--f-mono); font-size: .7rem; opacity: .7; }
.theme[aria-pressed="true"] { background: color-mix(in oklab, var(--accent) 16%, var(--surface)); border-color: var(--accent); color: var(--ink); }
.hint.center { text-align: center; margin: -.4rem 0 1rem; }

/* Boutons */
.btn { height: 48px; padding: 0 1.1rem; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: .4rem; touch-action: manipulation; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--btn-primary-bg); color: var(--btn-primary-ink); border-color: transparent; box-shadow: var(--btn-primary-shadow); }
.btn.big { width: 100%; height: 58px; font-size: 1.05rem; border-radius: 16px; }
.btn.danger { color: var(--danger); border-color: color-mix(in oklab, var(--danger) 50%, var(--line)); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.link { border: 0; background: none; height: auto; padding: .4rem 0; color: var(--muted); font-weight: 500; text-decoration: underline; }

/* Composition */
.setting { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .55rem 0; }
.setting + .setting { border-top: 1px solid var(--line); }
.setting b { display: block; }
.setting small { color: var(--muted); }
.stepper { display: flex; align-items: center; gap: .3rem; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); font-size: 1.2rem; font-weight: 700; }
.stepper button:disabled { opacity: .35; }
.stepper output { min-width: 2ch; text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 1.4rem; }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px var(--shadow-color); transition: transform .25s var(--ease); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.compo { display: flex; flex-wrap: wrap; gap: .4rem; margin: .9rem 0 0; }
.tag { font-family: var(--f-mono); font-size: .75rem; padding: .3rem .6rem; border-radius: 8px; background: var(--surface-2); }
.tag.civil { background: color-mix(in oklab, var(--ok) 18%, transparent); color: var(--ok); }
.tag.undercover { background: color-mix(in oklab, var(--danger) 16%, transparent); color: var(--danger); }
.tag.white { background: var(--ink); color: var(--bg); }
.error { color: var(--danger); font-size: .9rem; margin: .6rem 0 0; min-height: 1.2em; }

/* Distribution */
.stage { min-height: calc(100vh - 140px); min-height: calc(100dvh - 140px); display: flex; flex-direction: column; justify-content: center; gap: 1.2rem; text-align: center; }
.stage .who { font-family: var(--f-display); font-weight: 850; font-size: clamp(2.4rem, 12vw, 3.6rem); line-height: 1; overflow-wrap: anywhere; }
.secret { padding: 2rem 1rem; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); }
.secret .word { font-family: var(--f-display); font-weight: 850; font-size: clamp(2rem, 11vw, 3.2rem); line-height: 1.05; color: var(--accent); overflow-wrap: anywhere; }
.secret.white .word { color: var(--ink); }
.secret p { color: var(--muted); margin: .8rem 0 0; }
.progress { display: flex; gap: 4px; justify-content: center; }
.progress i { width: 18px; height: 5px; border-radius: 9px; background: var(--surface-2); }
.progress i.done { background: var(--accent); }

/* Partie */
.order { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; margin-top: .4rem; }
.order span { font-size: .88rem; padding: .25rem .55rem; border-radius: 8px; background: var(--surface-2); }
.order span:first-child { background: var(--signal-soft); color: var(--signal-ink); font-weight: 700; }
.players { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.player { display: flex; align-items: center; gap: .5rem; }
.player .vote { flex: 1; min-width: 0; justify-content: flex-start; height: 52px; font-size: 1.02rem; }
.player .vote span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player .peek { width: 52px; height: 52px; padding: 0; flex: none; }
.player.out .vote { opacity: .5; text-decoration: line-through; pointer-events: none; }
.player.out .peek { visibility: hidden; }

/* Résultats */
.banner { padding: 1.2rem; border-radius: 18px; text-align: center; margin-bottom: 1rem; }
.banner.civils { background: color-mix(in oklab, var(--ok) 18%, var(--surface)); }
.banner.imposteurs { background: color-mix(in oklab, var(--danger) 16%, var(--surface)); }
.banner.white { background: var(--ink); color: var(--bg); }
.banner b { display: block; font-family: var(--f-display); font-size: 1.7rem; line-height: 1.1; }
.words { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-bottom: 1rem; }
.words div { padding: .9rem; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-align: center; }
.words small { display: block; color: var(--muted); font-size: .78rem; }
.words b { font-family: var(--f-display); font-size: 1.2rem; overflow-wrap: anywhere; }
.roles { list-style: none; margin: 0 0 1rem; padding: 0; display: grid; gap: .35rem; }
.roles li { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding: .55rem .8rem; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.roles li.out { opacity: .6; }
.stack { display: grid; gap: .6rem; }

/* Fenêtres */
dialog { width: min(440px, calc(100% - 32px)); border: 1px solid var(--line); border-radius: 20px; background: var(--surface-2); color: var(--ink); padding: 1.3rem; }
dialog::backdrop { background: var(--overlay); backdrop-filter: blur(3px); }
dialog h2 { margin-bottom: .5rem; }
dialog p { color: var(--muted); margin: 0 0 1rem; }
dialog .actions { display: flex; gap: .5rem; justify-content: flex-end; flex-wrap: wrap; margin-top: 1rem; }
dialog .field { display: grid; gap: .35rem; margin-bottom: .7rem; }
dialog label { font-size: .85rem; color: var(--muted); }
.reveal-word { font-family: var(--f-display); font-weight: 850; font-size: 2.2rem; text-align: center; color: var(--accent); margin: 1rem 0; overflow-wrap: anywhere; }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); z-index: 110; max-width: calc(100% - 32px); padding: .75rem 1rem; border-radius: 14px; background: var(--ink); color: var(--bg); font-size: .92rem; box-shadow: var(--shadow); animation: toastIn .3s var(--ease); }
@keyframes toastIn { from { transform: translate(-50%, 12px); opacity: 0; } }
</style>
</head>
<body>
<header class="topbar">
  <a class="back-link" href="../" data-i18n="common.back">← BoardBox</a>
  <div class="topbar-actions">
    <button class="lang-btn" id="langBtn" type="button">EN</button>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Changer de thème" data-i18n-aria-label="common.theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main id="app" aria-live="polite"></main>

<!-- Confirmation générique -->
<dialog id="confirmDlg">
  <h2 id="confirmTitle"></h2>
  <p id="confirmText"></p>
  <div class="actions">
    <button class="btn" type="button" id="confirmNo" data-i18n="cancel">Annuler</button>
    <button class="btn primary" type="button" id="confirmYes">Confirmer</button>
  </div>
</dialog>

<!-- Revoir son mot -->
<dialog id="peekDlg">
  <h2 id="peekTitle"></h2>
  <p id="peekText"></p>
  <div class="reveal-word" id="peekWord" hidden></div>
  <div class="actions">
    <button class="btn" type="button" id="peekClose" data-i18n="close">Fermer</button>
    <button class="btn primary" type="button" id="peekShow" data-i18n="show">Afficher</button>
  </div>
</dialog>

<!-- Proposer une association -->
<dialog id="proposeDlg">
  <form method="dialog" id="proposeForm">
    <h2 data-i18n="propose.title">Proposer une association</h2>
    <p data-i18n="propose.text">Deux mots proches mais différents. Votre proposition sera ajoutée au jeu après validation.</p>
    <div class="field"><label for="propA" data-i18n="propose.wordA">Premier mot</label><input type="text" id="propA" maxlength="30" autocomplete="off" required></div>
    <div class="field"><label for="propB" data-i18n="propose.wordB">Second mot</label><input type="text" id="propB" maxlength="30" autocomplete="off" required></div>
    <div class="field"><label for="propTheme" data-i18n="propose.theme">Thème</label><select id="propTheme" required></select></div>
    <p class="error" id="propErr"></p>
    <div class="actions">
      <button class="btn" type="button" id="propCancel" data-i18n="cancel">Annuler</button>
      <button class="btn primary" type="submit" id="propSend" data-i18n="propose.send">Envoyer</button>
    </div>
  </form>
</dialog>

<script src="../commun/supabase-config.js?v=2"></script>
<script src="themes.js?v=4"></script>
<script src="mots.js?v=6"></script>
<script src="i18n.js?v=2"></script>
<script src="donnees.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
